examples:
  - id: model-essay
    title:
      zh: 题目→带标注范文
      en: Prompt → Annotated Model Essay
    description:
      zh: 给一道大作文题，输出题型判定、主要矛盾、立场路径和带SEE–S2–C标注的范文
      en: Give a Task 2 prompt; get question-type judgement, the central tension, a stance path and an annotated target-level essay
    prompt:
      zh: |-
        请用底层逻辑方法处理这道雅思大作文题：先判题型和主要矛盾，选择对应立场路径，再写一篇带SEE–S2–C标注的范文，最后做对应检查。

        题目：{{粘贴雅思大作文题目}}
      en: |-
        Apply the underlying-logic method to this IELTS Task 2 question: identify the question type and central tension, select the matching stance route, write an annotated target-level essay with SEE–S2–C labels, then do the correspondence check.

        Question: {{paste the IELTS Task 2 question}}
  - id: task1-chart
    title:
      zh: 小作文图表范文
      en: Task 1 Chart Model Essay
    description:
      zh: 给一道图表题，按Overall+分组+对比的方法写范文
      en: Give a chart prompt; get a model essay built on Overall + grouping + comparison
    prompt:
      zh: |-
        这道雅思小作文图表题，请按"Overall+分组+对比"的方法写范文，并检查不写原因。

        题目：{{粘贴雅思小作文题目及图表描述}}
      en: |-
        For this IELTS Task 1 chart question, write a model essay using the Overall + grouping + comparison method, and verify no reasons are given.

        Question: {{paste the Task 1 question and chart description}}
  - id: essay-correction
    title:
      zh: 作文批改
      en: Essay Correction
    description:
      zh: 提交作文，获得任务专属四项看板、逐段精改、两版英文及各自中文翻译
      en: Submit an essay for a task-specific scorecard, paragraph review, two English revisions and separate Chinese translations
    prompt:
      zh: |-
        请用标准精改批改我这篇雅思作文：按任务专属四项标准诊断，引用原句逐段说明问题，并给全文整合版及翻译、Polish版及翻译。

        原题：{{粘贴原题，没有可留空}}
        作文：{{粘贴你的作文}}
      en: |-
        Please give my IELTS essay a Standard Review: use the task-specific four criteria, quote and revise it paragraph by paragraph, then provide an integrated version and a Polish version, each followed by a Chinese translation.

        Original question: {{paste the question, or leave blank}}
        Essay: {{paste your essay}}
  - id: teaching-mode
    title:
      zh: 教学模式带练
      en: Teaching Mode Practice
    description:
      zh: 不直接给答案，先让用户自己判断再纠正，最后给对照范文
      en: "Socratic mode: make the user decide first, correct round by round, then show the annotated essay"
    prompt:
      zh: |-
        用教学模式带我练这道题：先让我自己判题型、定立场，你逐轮纠正，最后再给带标注的范文。

        题目：{{粘贴雅思写作题目}}
      en: |-
        Teach me with this question in teaching mode: let me judge the type and stance myself, correct me round by round, and only then show the annotated model essay.

        Question: {{paste the IELTS writing question}}
